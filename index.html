

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gohatsion Secondary School - Online Examination</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #123b70;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    font-size: 23px;
    margin-bottom: 8px;
}

header p {
    font-size: 14px;
}

.container {
    max-width: 480px;
    margin: 35px auto;
    padding: 15px;
}

.login-box {
    background: white;
    padding: 28px 22px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.login-box h2 {
    text-align: center;
    color: #123b70;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
    font-size: 14px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 7px;
    background: #123b70;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4f91;
}

#dashboard {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-top: 20px;
}

#message {
    margin-top: 15px;
    text-align: center;
    color: #dc2626;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>GOHATSION SECONDARY SCHOOL</h1>
    <p>Online Examination Management System</p>
</header>

<div class="container">

    <div class="login-box" id="loginBox">

        <h2>Student & Staff Login</h2>

        <p class="description">
            Welcome to Gohatsion Secondary School
            Online Examination System.
        </p>

        <form id="loginForm">

            <label for="role">Select User Type</label>
            <select id="role" required>
                <option value="">Select role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Administrator</option>
            </select>

            <label for="grade">Select Grade</label>
            <select id="grade" required>
                <option value="">Select grade</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>

            <label for="userId">Student / Staff ID</label>
            <input
                type="text"
                id="userId"
                placeholder="Enter your ID"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">LOGIN</button>

            <p id="message"></p>

        </form>
    </div>

    <div id="dashboard">
        <h2>Welcome!</h2>
        <p id="welcomeText"></p>

        <h3 style="margin-top:25px;">Examination Portal</h3>

        <p style="margin-top:12px;">
            Your examination dashboard will be available here.
        </p>

        <button onclick="logout()">Logout</button>
    </div>

</div>

<footer>
    <p>© 2026 Gohatsion Secondary School</p>
    <p>Online Examination System</p>
</footer>

<script>
document.getElementById("loginForm").addEventListener(
    "submit", function(event) {

    event.preventDefault();

    const role = document.getElementById("role").value;
    const grade = document.getElementById("grade").value;
    const userId = document.getElementById("userId").value;

    if (!role || !grade || !userId) {
        document.getElementById("message").textContent =
            "Please complete all fields.";
        return;
    }

    document.getElementById("message").textContent =
        "Authentication is not connected yet. Please wait for system setup.";
});

function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
}
</script>

</body>
</html>
