
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gohatsion Secondary School | Online Examination</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
    header{background:#123b65;color:white;padding:20px;text-align:center}
    main{max-width:850px;margin:25px auto;padding:15px}
    .card{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
    h2{color:#123b65}
    input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5df;border-radius:7px;font-size:16px}
    button{background:#1264a3;color:white;border:0;font-weight:bold;cursor:pointer}
    button:hover{background:#0c4e82}
    .secondary{background:#64748b}
    .hidden{display:none}
    .message{padding:12px;border-radius:7px;margin:10px 0;background:#e2e8f0}
    .error{background:#fee2e2;color:#991b1b}
    .success{background:#dcfce7;color:#166534}
    .item{padding:12px;border-bottom:1px solid #ddd}
    .small{font-size:13px;color:#64748b}
  </style>
</head>
<body>
<header>
  <h1>Gohatsion Secondary School</h1>
  <p>Online Examination System</p>
</header>

<main>
  <section id="loginCard" class="card">
    <h2>Login</h2>
    <label>Role</label>
    <select id="loginRole">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>

    <label>Student ID or Email</label>
    <input id="loginIdentity" placeholder="Student ID or email">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn" onclick="login()">Login</button>
    <div id="loginMessage" class="message hidden"></div>
    <p class="small">Students: use Student ID. Teachers and Admins: use email.</p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2 id="welcome">Dashboard</h2>
      <p id="userInfo"></p>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <section id="adminPanel" class="card hidden">
      <h2>Create Teacher Access Code</h2>
      <p class="small">Admin qofti tokkoof code uuma. Teacher account guutuu uumuu miti.</p>

      <input id="teacherName" placeholder="Teacher full name">
      <input id="teacherEmail" type="email" placeholder="Teacher email">

      <label>Subject</label>
      <select id="teacherSubject">
        <option value="">Loading subjects...</option>
      </select>

      <label>Grade</label>
      <select id="teacherGrade">
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>

      <label>Section</label>
      <select id="teacherSection"></select>

      <button onclick="createTeacherCode()">Create Access Code</button>
      <div id="codeMessage" class="message hidden"></div>
    </section>

    <section id="teacherPanel" class="card hidden">
      <h2>My Teaching Assignments</h2>
      <div id="assignments">Loading...</div>
    </section>

    <section id="examPanel" class="card">
      <h2 id="examHeading">Exams</h2>
      <div id="examList">Loading exams...</div>
    </section>
  </section>
</main>

<script>
  const SUPABASE_URL = "https://dpcsuoivnigkgpkjyjle.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let currentUser = null;
  let currentProfile = null;

  const sections = "ABCDEFGHIJKLM".split("");

  function showMessage(id, text, type = "") {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "message " + type;
    el.classList.remove("hidden");
  }

  function fillSections() {
    document.getElementById("teacherSection").innerHTML =
      sections.map(s => `<option value="${s}">${s}</option>`).join("");
  }
  fillSections();

  async function login() {
    const role = document.getElementById("loginRole").value;
    const identity = document.getElementById("loginIdentity").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");

    if (!identity || !password) {
      showMessage("loginMessage", "Email/Student ID fi password guuti.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
      // Student ID example: GHS-0001
      const email = role === "student"
        ? identity.toLowerCase() + "@students.gohatsion.edu.et"
        : identity.toLowerCase();

      const { data: authData, error: authError } =
        await db.auth.signInWithPassword({ email, password });

      if (authError) throw authError;

      currentUser = authData.user;

      const { data: profile, error: profileError } = await db
        .from("profiles")
        .select("id,full_name,email,role,grade")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (profileError) throw profileError;
      if (!profile) throw new Error("User profile hin argamne. Admin waliin qunnami.");
      if (profile.role !== role) {
        throw new Error("Role filatte fi role account kee wal hin simne.");
      }

      currentProfile = profile;
      await openDashboard();

    } catch (err) {
      await db.auth.signOut();
      showMessage("loginMessage", err.message || "Login failed.", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Login";
    }
  }

  async function openDashboard() {
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    document.getElementById("welcome").textContent =
      "Welcome, " + currentProfile.full_name;

    document.getElementById("userInfo").textContent =
      "Role: " + currentProfile.role +
      (currentProfile.grade ? " | Grade: " + currentProfile.grade : "");

    if (currentProfile.role === "admin") {
      document.getElementById("adminPanel").classList.remove("hidden");
      await loadSubjects();
    }

    if (currentProfile.role === "teacher") {
      document.getElementById("teacherPanel").classList.remove("hidden");
      await loadAssignments();
    }

    await loadExams();
  }

  async function loadSubjects() {
    const select = document.getElementById("teacherSubject");
    select.innerHTML = "<option value=''>Loading...</option>";

    const { data, error } = await db
      .from("subjects")
      .select("id,name")
      .order("name");

    if (error) {
      select.innerHTML = "<option value=''>Could not load subjects</option>";
      return;
    }

    select.innerHTML = "<option value=''>Select subject</option>" +
      data.map(s =>
        `<option value="${s.id}">${escapeHtml(s.name)}</option>`
      ).join("");
  }

  async function createTeacherCode() {
    const full_name = document.getElementById("teacherName").value.trim();
    const email = document.getElementById("teacherEmail").value.trim();
    const subject_id = document.getElementById("teacherSubject").value;
    const grade = Number(document.getElementById("teacherGrade").value);
    const section = document.getElementById("teacherSection").value;

    if (!full_name || !email || !subject_id) {
      showMessage("codeMessage", "Maqaa, email fi subject guuti.", "error");
      return;
    }

    try {
      const { data: sessionData } = await db.auth.getSession();
      if (!sessionData.session) throw new Error("Admin irra deebi'ii login godhi.");

      // Supabase sends the current user's access token automatically.
      const { data, error } = await db.functions.invoke("Create-teacher", {
        body: { full_name, email, subject_id, grade, section }
      });

      if (error) throw error;
      if (data && data.error) throw new Error(data.error);

      const code = data.access_code || data.code || data.teacher_code;

      if (code) {
        showMessage(
          "codeMessage",
          "Teacher Access Code: " + code +
          " — code kana teacher qofaaf kenni. Yeroo tokko qofa mul'ata.",
          "success"
        );
      } else {
        showMessage(
          "codeMessage",
          JSON.stringify(data),
          "success"
        );
      }

      document.getElementById("teacherName").value = "";
      document.getElementById("teacherEmail").value = "";

    } catch (err) {
      showMessage("codeMessage", err.message || "Code uumuu hin dandeenye.", "error");
    }
  }

  async function loadAssignments() {
    const target = document.getElementById("assignments");

    const { data, error } = await db
      .from("teacher_assignments")
      .select("grade,section,subjects(name)")
      .eq("teacher_id", currentUser.id);

    if (error) {
      target.textContent = "Assignments fe'uu hin dandeenye: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      target.textContent = "Amma assignment hin jiru.";
      return;
    }

    target.innerHTML = data.map(a =>
      `<div class="item">
        ${escapeHtml(a.subjects?.name || "Subject")} —
        Grade ${a.grade}, Section ${escapeHtml(a.section || "")}
      </div>`
    ).join("");
  }

  async function loadExams() {
    const target = document.getElementById("examList");
    const role = currentProfile.role;

    let query = db.from("exams")
      .select("id,title,grade,duration_minutes,approval_status,is_published")
      .order("created_at", { ascending: false });

    if (role === "student") {
      query = query.eq("is_published", true)
        .eq("grade", currentProfile.grade);
    } else if (role === "teacher") {
      query = query.eq("created_by", currentUser.id);
    }

    const { data, error } = await query;

    if (error) {
      target.textContent = "Exam fe'uu hin dandeenye: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      target.textContent = "Exam ammaaf hin jiru.";
      return;
    }

    target.innerHTML = data.map(e =>
      `<div class="item">
        <strong>${escapeHtml(e.title)}</strong><br>
        Grade ${e.grade} |
        ${e.duration_minutes} minutes |
        ${escapeHtml(e.approval_status || "")}
      </div>`
    ).join("");
  }

  async function logout() {
    await db.auth.signOut();
    currentUser = null;
    currentProfile = null;
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("loginPassword").value = "";
    document.getElementById("loginMessage").classList.add("hidden");
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
  }

  // Restore an existing signed-in session.
  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
      currentUser = null;
      currentProfile = null;
    }
  });
</script>
</body>
</html>
